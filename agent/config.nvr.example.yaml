# Para quem tem NVR Intelbras: copie para config.yaml (cp / copy) e ajuste só os nomes e canais.
# O IP, usuário e senha do NVR ficam no .env (NVR_IP, NVR_USUARIO, NVR_SENHA).
intervalo_s: 15
historico_a_cada_s: 300
quadro_da_camera_a_cada_s: 60
largura_foto: 960

deteccao:
  modelo: yolov8s.pt
  confianca_minima: 0.25
  tamanho: 960

identificacao:
  pontuacao_minima: 0.55
  margem_minima: 0.05

# canal = número da câmera no NVR; subtipo 1 = stream leve (recomendado), 0 = stream principal
cameras:
  - { nome: "Quarto",   ambiente: "Quarto",   fonte: nvr, canal: 1 }
  - { nome: "Corredor", ambiente: "Corredor", fonte: nvr, canal: 2 }
  - { nome: "Sala",     ambiente: "Sala",     fonte: nvr, canal: 3 }
