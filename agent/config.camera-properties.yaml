# Usa as câmeras do arquivo camera.properties (o mesmo do outro app). Copie-o para esta pasta.
cameras_arquivo: camera.properties

# Acha as câmeras Intelbras sozinho pela rede (o IP pode mudar; o app guarda o apelido de cada uma).
# Do camera.properties só são usados o login das Intelbras e as câmeras 'rtsp' (Mercusys etc.).
descobrir_rede: true

intervalo_s: 300             # varredura a cada 5 minutos (ou na hora, em "Onde estão agora?")
historico_a_cada_s: 0  # 0 = sem registro por tempo: só entra no histórico quando a posição muda
quadro_da_camera_a_cada_s: 60
largura_foto: 960

# Achar pessoas nas câmeras (só detecta; não reconhece quem é). false desliga.
detectar_pessoas: true
compactar_fotos: true    # faxina automática das fotos antigas (desfoca pessoas e compacta), aos poucos
proteger_pessoas: true   # corpo das pessoas desfocado nas imagens enviadas; só o rosto fica nítido

deteccao:
  modelo: yolov8s.pt
  confianca_minima: 0.25
  tamanho: 960

identificacao:
  pontuacao_minima: 0.55
  margem_minima: 0.05
