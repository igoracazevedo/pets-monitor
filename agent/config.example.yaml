# Copie para config.yaml e ajuste. Variáveis ${NOME} vêm do arquivo .env.
intervalo_s: 300             # varredura a cada 5 minutos (ou na hora, em "Onde estão agora?")
historico_a_cada_s: 0  # 0 = sem registro por tempo: só entra no histórico quando a posição muda
quadro_da_camera_a_cada_s: 60  # foto da câmera para a aba "Câmeras"
largura_foto: 960            # redimensiona as fotos guardadas

# Achar pessoas nas câmeras (só detecta; não reconhece quem é). false desliga.
detectar_pessoas: true
compactar_fotos: true    # faxina automática das fotos antigas (desfoca pessoas e compacta), aos poucos
proteger_pessoas: true   # corpo das pessoas desfocado nas imagens enviadas; só o rosto fica nítido

deteccao:
  modelo: yolov8s.pt         # baixa sozinho na primeira vez (yolov8s.pt é mais preciso e mais pesado)
  confianca_minima: 0.25
  tamanho: 960

identificacao:
  # só vale com 2+ pets: precisa acertar a cor e ficar claramente à frente do outro
  pontuacao_minima: 0.55
  margem_minima: 0.05

# Usando o camera.properties do outro app? Descomente a linha abaixo e apague a lista 'cameras'.
# cameras_arquivo: camera.properties

cameras:
  - nome: Sala
    ambiente: Sala de estar
    fonte: rtsp
    url: ${CAM_SALA_URL}
  - nome: Cozinha
    ambiente: Cozinha
    fonte: rtsp
    url: ${CAM_COZINHA_URL}
  # câmera que só entrega foto por HTTP:
  # - nome: Quintal
  #   fonte: http
  #   url: http://192.168.1.52/snapshot.jpg
  #   usuario: admin
  #   senha: ${CAM_QUINTAL_SENHA}
  # teste sem câmera (usa uma imagem do disco):
  # - nome: Teste
  #   fonte: arquivo
  #   caminho: exemplos/sala.jpg

# Imagens guardadas só neste PC (fora do OneDrive) para uma segunda leitura em segundo plano que acha eventos perdidos
# buffer:
#   ativo: true
#   horas: 12
#   intervalo_s: 30      # câmeras de banheiro/bebedouro/comedouro: uma imagem a cada 30 s
#   max_mb: 2000
#   pasta: D:\pets-buffer   # opcional; o padrão é %LOCALAPPDATA%\pets-monitor\buffer
# Catálogo: procura bebedouro/comedouro/banheiro/cama pela aparência, mesmo que mudem de lugar ou de câmera
# catalogo:
#   ativo: true
